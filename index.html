<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>البركة TV - التطبيق الشامل</title>
  <!-- مكتبة تشغيل البث المباشر HLS -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <!-- خطوط وتنسيقات أيقونات -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #0a192f 0%, #030a14 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* الشريط العلوي */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 35px;
      background: rgba(4, 16, 30, 0.85);
      border-bottom: 2px solid rgba(212, 175, 55, 0.4);
      backdrop-filter: blur(10px);
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo-badge {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      border: 2px solid #d4af37;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: #d4af37;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
    }

    .brand-title {
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 0.5px;
      color: #fff;
    }

    .brand-title span {
      color: #d4af37;
    }

    .developer-tag {
      font-size: 16px;
      color: #d4af37;
      background: rgba(212, 175, 55, 0.1);
      padding: 8px 18px;
      border-radius: 20px;
      border: 1px solid rgba(212, 175, 55, 0.3);
      font-weight: bold;
    }

    /* منطقة المشغل الرئيسي */
    .main-container {
      display: flex;
      flex: 1;
      padding: 20px 35px;
      gap: 25px;
    }

    .player-section {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      height: 420px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1.5px solid rgba(212, 175, 55, 0.5);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .now-playing {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(12, 33, 56, 0.8);
      padding: 12px 20px;
      border-radius: 8px;
      border: 1px solid rgba(212, 175, 55, 0.2);
    }

    .now-playing h3 {
      font-size: 18px;
      color: #d4af37;
    }

    /* قسم شبكة القنوات */
    .channels-section {
      flex: 1.8;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .category-tabs {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .tab-btn {
      background: rgba(12, 33, 56, 0.7);
      color: #fff;
      border: 1px solid rgba(212, 175, 55, 0.3);
      padding: 8px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s ease;
      white-space: nowrap;
    }

    .tab-btn.active, .tab-btn:hover {
      background: linear-gradient(135deg, #d4af37, #aa820a);
      color: #030a14;
      font-weight: bold;
      border-color: #d4af37;
    }

    .channels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
      max-height: 480px;
      overflow-y: auto;
      padding-right: 5px;
    }

    /* شريط التمرير */
    .channels-grid::-webkit-scrollbar {
      width: 6px;
    }
    .channels-grid::-webkit-scrollbar-thumb {
      background: rgba(212, 175, 55, 0.4);
      border-radius: 4px;
    }

    .channel-card {
      background: linear-gradient(145deg, #0d243f, #071526);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 10px;
      padding: 15px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.25s ease;
      text-align: center;
    }

    .channel-card:hover, .channel-card:focus {
      transform: translateY(-4px);
      border-color: #d4af37;
      box-shadow: 0 6px 15px rgba(212, 175, 55, 0.25);
      background: linear-gradient(145deg, #133358, #0b1f38);
    }

    .channel-icon {
      font-size: 24px;
      color: #d4af37;
    }

    .channel-title {
      font-size: 13px;
      font-weight: 600;
      color: #e0e0e0;
    }

    /* الشريط السفلي */
    footer {
      margin-top: auto;
      background: #02060d;
      padding: 12px 35px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(212, 175, 55, 0.2);
      font-size: 13px;
      color: #8fa0b5;
    }

    @media (max-width: 900px) {
      .main-container {
        flex-direction: column;
        padding: 15px;
      }
      .video-wrapper {
        height: 240px;
      }
    }
  </style>
</head>
<body>

  <!-- شريط العنوان والهوية -->
  <header>
    <div class="brand-section">
      <div class="logo-badge">
        <i class="fa-solid fa-tv"></i>
      </div>
      <div class="brand-title">البركة <span>TV</span></div>
    </div>
    <div class="developer-tag">
      <i class="fa-solid fa-code"></i> برمجة: عبد الله أحمد
    </div>
  </header>

  <!-- جسم التطبيق -->
  <div class="main-container">
    
    <!-- مشغل البث التفاعلي -->
    <section class="player-section">
      <div class="video-wrapper">
        <video id="videoPlayer" controls autoplay></video>
      </div>
      <div class="now-playing">
        <span id="currentStatus" style="color: #4cd137;">● بث حي ومباشر</span>
        <h3 id="currentChannelName">اختر قناة لبدء المشاهدة</h3>
      </div>
    </section>

    <!-- شبكة القنوات -->
    <section class="channels-section">
      <div class="category-tabs">
        <button class="tab-btn active">جميع القنوات</button>
        <button class="tab-btn">إخبارية</button>
        <button class="tab-btn">إسلامية</button>
        <button class="tab-btn">وثائقية ومنوعة</button>
      </div>

      <div class="channels-grid" id="channelsList">
        <!-- يتم توليد القنوات تلقائياً عبر JavaScript -->
      </div>
    </section>

  </div>

  <!-- الشريط السفلي -->
  <footer>
    <div><i class="fa-solid fa-shield-halved"></i> نظام تشغيل متصل وسريع</div>
    <div>تطبيق البركة TV © 2026 - جميع الحقوق محفوظة للمطور عبد الله أحمد</div>
  </footer>

  <script>
    // قائمة القنوات وروابط البث المباشر (HLS / m3u8)
    const channels = [
      {
        name: "الجزيرة الإخبارية",
        icon: "fa-bullhorn",
        url: "https://live-hls-web-aje.getaj.net/AJE/01.m3u8"
      },
      {
        name: "الجزيرة الإنجليزية",
        icon: "fa-globe",
        url: "https://live-hls-web-aje.getaj.net/AJE/index.m3u8"
      },
      {
        name: "قناة القرآن الكريم",
        icon: "fa-kaaba",
        url: "https://win.holol.com/live/quran/playlist.m3u8"
      },
      {
        name: "قناة السنة النبوية",
        icon: "fa-mosque",
        url: "https://win.holol.com/live/sunnah/playlist.m3u8"
      },
      {
        name: "فرانس 24 عربي",
        icon: "fa-newspaper",
        url: "https://static.france24.com/live/F24_AR_LO_HLS/live_tv.m3u8"
      },
      {
        name: "TRT عربي",
        icon: "fa-satellite",
        url: "https://tv-trtarabi.medya.trt.com.tr/master.m3u8"
      },
      {
        name: "روسيا اليوم (RT)",
        icon: "fa-tower-broadcast",
        url: "https://rt-ara.rttv.com/live/rtarab/playlist.m3u8"
      },
      {
        name: "BBC عربي",
        icon: "fa-radio",
        url: "https://stream.live.vc.bbcmedia.co.uk/bbc_arabic_tv"
      },
      {
        name: "DW عربية",
        icon: "fa-tv",
        url: "https://dwamdstream104.akamaized.net/hls/live/2015530/dwstream104/index.m3u8"
      }
    ];

    const channelsContainer = document.getElementById('channelsList');
    const video = document.getElementById('videoPlayer');
    const currentChannelText = document.getElementById('currentChannelName');

    // توليد أزرار القنوات
    channels.forEach((ch, idx) => {
      const card = document.createElement('div');
      card.className = 'channel-card';
      card.tabIndex = 0; // لتمكين التحكم بالريموت
      card.innerHTML = `
        <i class="fa-solid ${ch.icon} channel-icon"></i>
        <div class="channel-title">${ch.name}</div>
      `;
      
      card.onclick = () => playStream(ch);
      card.onkeydown = (e) => { if(e.key === 'Enter') playStream(ch); };
      
      channelsContainer.appendChild(card);
    });

    // دالة تشغيل البث
    function playStream(channel) {
      currentChannelText.innerText = channel.name;

      if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(channel.url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play();
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = channel.url;
        video.addEventListener('loadedmetadata', () => {
          video.play();
        });
      }
    }

    // تشغيل أول قناة تلقائياً عند الفتح
    if (channels.length > 0) {
      playStream(channels[0]);
    }
  </script>
</body>
</html>
